server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve the matching static file if one exists, otherwise fall back to index.html so
    # client-side routing (and plain page refreshes on any route) doesn't 404.
    location / {
        try_files $uri /index.html;
    }
}
